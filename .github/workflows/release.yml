name: Release

# Push a tag named after the version in obsidian/build.gradle.kts (v2.0.0 for 2.0.0) to release:
# the library goes into the Maven repository on GitHub Pages (gh-pages branch, maven/ folder), and
# the AAR, its sources and the catalog APK are attached to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the library version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' obsidian/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in obsidian/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build, test and lint
        run: ./gradlew build --stacktrace

      - name: Check out the Maven repository (gh-pages)
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git show-ref --quiet refs/heads/gh-pages; then
            git worktree add pages gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi

      - name: Refuse to overwrite a released version
        run: |
          if [ -d "pages/maven/dev/redfox/obsidian/${{ steps.version.outputs.version }}" ]; then
            echo "Version ${{ steps.version.outputs.version }} is already published" >&2
            exit 1
          fi

      - name: Publish into the Maven repository
        run: ./gradlew :obsidian:publishReleasePublicationToReleaseRepository -PreleaseRepo="$PWD/pages/maven"

      - name: Push the Maven repository
        working-directory: pages
        run: |
          touch .nojekyll
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Obsidian ${{ steps.version.outputs.version }}"
          git push origin gh-pages

      - name: Build the catalog app
        run: ./gradlew :catalog:assembleRelease

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.version.outputs.version }}
          # This version's section of the changelog, without its heading.
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          dir=obsidian/build/outputs/aar
          cp "$dir/obsidian-release.aar" "obsidian-$version.aar"
          cp "pages/maven/dev/redfox/obsidian/$version/obsidian-$version-sources.jar" .
          cp catalog/build/outputs/apk/release/catalog-release.apk "obsidian-catalog-$version.apk"
          gh release create "$GITHUB_REF_NAME" \
            --title "Obsidian $version" \
            --notes-file notes.md \
            "obsidian-$version.aar" "obsidian-$version-sources.jar" "obsidian-catalog-$version.apk"
