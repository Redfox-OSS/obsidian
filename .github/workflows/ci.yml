name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Also checks that the Gradle wrapper jar is genuine.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        run: ./gradlew build --stacktrace

      - name: Publish to the local Maven repository
        run: ./gradlew :obsidian:publishToMavenLocal

      - name: Build the catalog app
        run: ./gradlew :catalog:assembleRelease

      - name: Upload the catalog APK
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-catalog
          path: catalog/build/outputs/apk/release/*.apk

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: obsidian/build/reports/lint-results-*.html
