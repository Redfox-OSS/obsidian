[versions]
# Apps that use Obsidian build on the same toolchain: AGP 9.2 / Kotlin 2.2.10 / Compose BOM 2026.02.01.
agp = "9.2.1"
kotlin = "2.2.10"
composeBom = "2026.02.01"
# 1.7.2 is the newest Haze built against Compose 1.10 / Kotlin 2.2 (2.x needs Compose 1.12 + Kotlin 2.4).
haze = "1.7.2"
junit = "4.13.2"
# Catalog app only
activityCompose = "1.13.0"
navigation3 = "1.0.0"
binaryCompatibilityValidator = "0.18.1"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-metadata-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }

# Catalog app only
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }

# Gradle plugins, for the build-logic convention plugins
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }

# Convention plugins (build-logic)
obsidian-android-application = { id = "obsidian.android.application" }
obsidian-android-library = { id = "obsidian.android.library" }
obsidian-android-compose = { id = "obsidian.android.compose" }
